name: 外匯情報只讀分析
on:
  schedule:
    - cron: '8,38 * * * *'
  workflow_dispatch:
    inputs:
      cloud_schedule_id:
        description: 雲端自動排程收據，手動執行留空
        required: false
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: fx-intel-analysis
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FX_CLOUD_URL: https://fx-intel-research.fxresearch-f4a7057a.workers.dev
      FREE_PLAN_CONFIRMED: 'yes'
      FX_CLOUD_SCHEDULE_ID: ${{ github.event.inputs.cloud_schedule_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 驗證與解開程式包
        run: |
          python3 - <<'PY'
          import hashlib,zipfile,pathlib
          p=pathlib.Path('source.zip')
          if hashlib.sha256(p.read_bytes()).hexdigest() != '1f1f29745dbe6949f2b675b8f0de9ce07489493fe17500e446b9a50f0f324b34':
              raise SystemExit('程式包完整性檢查失敗')
          with zipfile.ZipFile(p) as z:
              for n in z.namelist():
                  if pathlib.PurePosixPath(n).is_absolute() or '..' in pathlib.PurePosixPath(n).parts:
                      raise SystemExit('拒絕不安全路徑')
              z.extractall('.')
          PY
      - name: 測試與分析（不下單）
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          run_analysis() {
            python3 -c 'import urllib.request,runpy; o=urllib.request.build_opener(); o.addheaders=[("User-Agent","FXIntelResearchCloud/1.0 (read-only research)")]; urllib.request.install_opener(o); runpy.run_module("fallback.run_analysis",run_name="__main__")'
          }
          run_analysis || run_analysis
